[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kittenml"
version = "0.9.4"
description = "Text-to-speech with voice cloning and expression control, plus ultra-lightweight models that run on CPU"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache 2.0"}
authors = [
    {name = "KittenML"}
]
keywords = ["text-to-speech", "tts", "speech-synthesis", "voice-cloning", "neural-networks", "onnx"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=4.55",
    "safetensors",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "huggingface_hub",
    # huggingface_hub downloads over httpx, which offers Brotli to the Hub
    # whenever a Brotli package is importable. Its fallback backend,
    # brotlicffi, errors mid-stream on some CDN responses ("decoder process
    # called with data when 'can_accept_more_data()' is False"), failing the
    # download. httpx prefers these C bindings over brotlicffi, so having
    # them installed keeps that path out of reach.
    "brotli",
    "einops",
    "diffusers",
    "omegaconf",
    "hydra-core",
    "s3tokenizer",
    "resemble-perth",
    "pyloudnorm",
    "kitten-text-processing>=0.1.0",
    "espeakng_loader",
    "phonemizer",
    "onnxruntime",
]

[project.urls]
Homepage = "https://github.com/KittenML/KittenTTS"
Repository = "https://github.com/KittenML/KittenTTS"
Issues = "https://github.com/KittenML/KittenTTS/issues"

[project.optional-dependencies]
vllm = ["vllm==0.31.0; sys_platform == 'linux'"]

[project.entry-points."vllm.general_plugins"]
kittenml = "kittenml.kittentts2.vllm.loader:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["kittenml*"]

[tool.setuptools.package-data]
kittenml = ["*.json", "*.txt", "*.onnx"]
